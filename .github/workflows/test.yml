---
# yamllint disable rule:line-length
name: test
'on':
  push:
  pull_request:
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          cat > test.bib << EOT
          @misc{x,
            title={{Hello, World!}},
            author={Bugayenko, Yegor},
            year={2024}
          }
          EOT
      - run: |
          docker build --tag bibcop-action:test .
          docker run --rm --env INPUT_OPTS=--verbose --volume "${PWD}:/w" bibcop-action:test
